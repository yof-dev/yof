# yof as a GitHub Action: runs `yof check` on the checked-out repository. Rules only, on the runner; the only network
# calls are package-registry lookups (npm, PyPI, OSV), which `offline: true` turns off.
name: yof check
description: Catch leaked keys and made-up packages before they ship.
author: Mondaily
branding:
  icon: shield
  color: green
inputs:
  path:
    description: Folder to check, relative to the repository root.
    required: false
    default: "."
  offline:
    description: Set to "true" to skip the package-registry lookups (keys only).
    required: false
    default: "false"
  version:
    description: The @yof/cli version to run.
    required: false
    default: "0.1.0"
runs:
  using: composite
  steps:
    - name: yof check
      shell: bash
      env:
        YOF_PATH: ${{ inputs.path }}
        YOF_OFFLINE: ${{ inputs.offline }}
        YOF_VERSION: ${{ inputs.version }}
      run: |
        args=(check "$YOF_PATH")
        if [ "$YOF_OFFLINE" = "true" ]; then args+=(--offline); fi
        npx --yes "@yof/cli@${YOF_VERSION}" "${args[@]}"
